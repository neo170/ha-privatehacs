[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-privatehacs"
version = "0.0.41"
description = "Private GitHub integration store for Home Assistant"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"